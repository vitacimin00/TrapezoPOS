# JVM args tuned for large single-module Kotlin/Compose build
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
# KSP 2.2.10 still wires generated Kotlin sources; permit this with AGP built-in Kotlin.
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# R8 compatibility mode.
#
# R8 "full mode" (the AGP 8+ default) crashed the minified release build when opening the
# barcode scanner:
#   java.lang.NullPointerException: Attempt to invoke virtual method
#   'java.lang.Class java.lang.Object.getClass()' on a null object reference
# Deobfuscated frames: com.trapezo.pos.scanner.BarcodeScannerScreenKt$$ExternalSyntheticLambda6
# -> androidx.compose.runtime.DisposableEffectImpl -> RememberEventDispatcher. The same flow works
# in the debug build and after disabling full mode, so full mode's extra assumptions (aggressive
# lambda/class merging plus dropped runtime type identity in CameraX's Dagger-generated
# camera2.pipe graph) are the trigger.
#
# Compatibility mode still runs R8: shrinking, optimization and obfuscation remain enabled. This
# is preferred over adding broad `-keep class com.trapezo.**` rules, which would defeat shrinking.
android.enableR8.fullMode=false
