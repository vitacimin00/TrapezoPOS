# JVM args tuned for large single-module Kotlin/Compose build
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
# KSP 2.2.10 still wires generated Kotlin sources; permit this with AGP built-in Kotlin.
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# R8 compatibility mode — KNOWN RELEASE LIMITATION.
#
# R8 "full mode" (the AGP 8+ default) reproducibly crashes the minified release build on the
# FIRST barcode-scanner open/close cycle:
#
#   java.lang.NullPointerException: Attempt to invoke virtual method
#   'java.lang.Class java.lang.Object.getClass()' on a null object reference
#     at com.trapezo.pos.scanner.BarcodeScannerScreenKt$$ExternalSyntheticLambda6
#     at androidx.compose.runtime.DisposableEffectImpl
#     at androidx.camera.camera2.pipe.config.DaggerCameraPipeComponent$Camera2ControllerComponentImpl
#     at androidx.compose.material3.DatePickerKt$HorizontalMonthsList$1$$ExternalSyntheticLambda1
#
# Verified against the CURRENT source (Track H2 Revision 02), i.e. WITH the scanner disposal-race
# fix in place, on a freshly built and hash-verified APK. Retracing against mapping.txt shows R8
# merging the scanner's DisposableEffect onDispose lambda into a shared synthetic dispatch class
# (`$r8$classId`) alongside unrelated Material3 DatePicker lambdas; a capture field is null on the
# executed branch, so the implicit null-check throws before onDispose's own try/catch can run.
#
# One narrow, supported optimization-exclusion rule was tested and FAILED to fix it:
#   -keep,allowshrinking,allowobfuscation class com.trapezo.pos.scanner.BarcodeScannerScreenKt** { *; }
# mapping.txt confirmed the scanner lambdas were still merged with foreign lambdas under that
# rule, and the crash still reproduced. It was therefore removed rather than left in place.
#
# Compatibility mode still runs R8: shrinking, optimization and obfuscation all remain enabled.
# This is preferred over blanket `-keep class com.trapezo.**` rules, which would defeat shrinking.
android.enableR8.fullMode=false

