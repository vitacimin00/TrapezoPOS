name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Third-party actions are pinned by FULL 40-character commit SHA so a moved tag
      # cannot silently change what runs in CI.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Make wrapper executable
        run: chmod +x gradlew

      # ---------------------------------------------------------------------
      # EPHEMERAL CI-ONLY signing keystore.
      #
      # These are throwaway values that exist only for the lifetime of this runner. Their sole
      # purpose is to prove the release/R8/signing path actually compiles and packages, because
      # assembleRelease now FAILS CLOSED without signing configuration.
      #
      # This is NOT the production key. The production keystore is never generated, stored or
      # referenced in CI, and the resulting APK/AAB is deliberately NOT uploaded anywhere.
      # ---------------------------------------------------------------------
      - name: Generate ephemeral CI signing keystore
        run: |
          set -euo pipefail
          CI_KEYSTORE="$RUNNER_TEMP/ci-ephemeral.jks"
          CI_PASSWORD="ci-ephemeral-$(date +%s)-$RANDOM"
          keytool -genkeypair \
            -keystore "$CI_KEYSTORE" \
            -storetype JKS \
            -storepass "$CI_PASSWORD" \
            -keypass "$CI_PASSWORD" \
            -alias ci-ephemeral \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Trapezo POS CI Ephemeral, OU=CI, O=Trapezo, L=NA, ST=NA, C=ID"
          {
            echo "storeFile=$CI_KEYSTORE"
            echo "storePassword=$CI_PASSWORD"
            echo "keyAlias=ci-ephemeral"
            echo "keyPassword=$CI_PASSWORD"
          } > keystore.properties
          echo "Ephemeral CI signing configuration written (never a production key)."

      - name: Unit tests (debug + release), debug build, instrumentation build
        # testReleaseUnitTest now genuinely exists (the release unit-test component is enabled in
        # app/build.gradle.kts), so the release JVM suite runs in CI alongside the debug one.
        run: |
          ./gradlew \
            testDebugUnitTest \
            testReleaseUnitTest \
            assembleDebug \
            assembleDebugAndroidTest \
            --stacktrace

      - name: Release lint, minified release build, app bundle, and R8 config
        # bundleRelease and analyzeReleaseR8Config run against the FINAL R8 configuration, so CI
        # verifies both shippable artifact paths (APK + AAB) and the shrinker's resolved config.
        # The artifacts themselves are never uploaded — only the lint report is.
        run: |
          ./gradlew \
            lintRelease \
            assembleRelease \
            bundleRelease \
            :app:analyzeReleaseR8Config \
            --stacktrace

      # The ephemeral keystore and its properties must never outlive the job. The runner is
      # discarded automatically, but remove them explicitly so nothing can be picked up by a
      # later step or artifact upload.
      - name: Remove ephemeral signing material
        if: always()
        run: |
          rm -f keystore.properties
          rm -f "$RUNNER_TEMP/ci-ephemeral.jks"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-release-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
